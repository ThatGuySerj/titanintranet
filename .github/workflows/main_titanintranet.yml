# The intranet, to its own Azure Web App from its own repository.
#
# It used to live inside the ticket repository, and that was the wrong shape:
# one process meant one restart, so renaming a link on the noticeboard took the
# site people file tickets in down with it. Nothing here touches that site now.
#
# ---------------------------------------------------------------------------
# WHERE THE TIME GOES, because it is not obvious and it was not the runner.
#
# What is uploaded to Azure is the source, about a megabyte. What takes the
# minutes is what happens AFTERWARDS, on the web app itself: Azure sees
# SCM_DO_BUILD_DURING_DEPLOYMENT=true and runs pip install over
# requirements.txt on the instance. That is 110 MB of wheels - PyMuPDF alone is
# most of it - fetched and unpacked on one core of a Basic B1 that the ticket
# site is also using. Then the container restarts and takes a cold start to
# answer. The deploy action waits for all of it, which is why a one-word change
# to a link costs the same as a rewrite.
#
# So this file does what it can, which is stop paying for things twice:
#
#   - ONE job, not two. The old shape built a virtualenv on the runner to run
#     the tests, threw it away, uploaded the source as an artifact, booted a
#     second runner, downloaded it again, and handed it to Azure - which then
#     built the same virtualenv a second time. The artifact round trip bought
#     nothing here.
#   - The test virtualenv lives in /tmp, so it cannot end up in the package.
#   - pip is cached between runs, so the test install is a restore and not a
#     download.
#
# The rest of the time is Azure's, and the only real ways to spend less of it
# are to move the build onto the runner (deploy the virtualenv, set
# SCM_DO_BUILD_DURING_DEPLOYMENT=false) or to stop sharing one core with the
# ticket site. Both are decisions with a cost, and neither belongs in a comment
# in a YAML file - the README has the argument.
# ---------------------------------------------------------------------------

name: Build and deploy - titanintranet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # In /tmp on purpose. A virtualenv in the workspace would be swept into
      # the package and shipped to Azure - 110 MB of wheels that Azure is about
      # to build for itself anyway.
      #
      # No database and no network needed for any of the three suites. They are
      # the ones that would catch a permissions mistake, and a card that
      # wrongly stays visible is a fault nobody reports.
      - name: Install dependencies and run the tests
        run: |
          python -m venv /tmp/testenv
          /tmp/testenv/bin/pip install --quiet --upgrade pip
          /tmp/testenv/bin/pip install --quiet -r requirements.txt pytest
          SECRET_KEY=ci /tmp/testenv/bin/python -m pytest -q

      # Two attempts, because one of these is not a failure worth a red tick.
      #
      # OneDeploy answers 503 when the app's deployment endpoint is busy or
      # restarting - which on a Basic plan with two sites on it happens on its
      # own now and then, and happened on the 16th. Nothing was wrong with the
      # package: the same commit deployed on the next push. So the first
      # attempt is allowed to fail, and a second one goes a minute later.
      #
      # A full package deploy is idempotent, so a retry cannot half-apply
      # anything the first attempt started.
      - name: 'Deploy to Azure Web App'
        id: deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'titanintranet'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_TITANINTRANET }}

      - name: Wait for the app to settle
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "The first attempt failed. Waiting a minute and trying once more."
          sleep 60

      - name: 'Deploy to Azure Web App (second attempt)'
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'titanintranet'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_TITANINTRANET }}

      # And then ask the site itself, because "deployment succeeded" and "the
      # site is answering" are different claims and only the second one
      # matters. /healthz needs no sign-in and says which of config, database
      # and auth is unhappy.
      #
      # An app that has just restarted takes a few seconds to answer the first
      # request, so this waits rather than judging on one try. 503 is the app
      # up and something behind it down - that is printed and allowed, because
      # a database blip is not a reason to call the deploy broken.
      - name: Check the site came back
        run: |
          URL=https://titanintranet-b7bghzcdcxewgjd7.canadacentral-01.azurewebsites.net/healthz
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL") || CODE=000
            echo "attempt $i: HTTP $CODE"
            case "$CODE" in
              200) echo "--- /healthz ---"; cat /tmp/health.json; echo; exit 0 ;;
              503) echo "::warning::The app is up but /healthz is unhappy:";
                   cat /tmp/health.json; echo; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::The site did not answer for six minutes after the deploy."
          exit 1
